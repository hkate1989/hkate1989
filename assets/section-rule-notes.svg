<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 92" role="img" aria-labelledby="title">
  <title id="title">Section 02 — Field Notes</title>
  <style>
    .ink{fill:#171714}.rule{stroke:#171714}.red{fill:#6f1d2c}.sans{font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Courier New',monospace}
    @media(prefers-color-scheme:dark){.ink{fill:#eee7d8}.rule{stroke:#eee7d8}.red{fill:#b86a73}}
  </style>
  <line class="rule" x1="0" y1="10" x2="1200" y2="10"/>
  <text class="red mono" x="0" y="64" font-size="17" letter-spacing="3">02 /</text>
  <text class="ink sans" x="82" y="66" font-size="35" font-weight="700" letter-spacing="2">FIELD NOTES</text>
  <text class="ink mono" x="1200" y="62" text-anchor="end" font-size="13" letter-spacing="2">METHOD / INQUIRIES / AFTER HOURS</text>
